name: Tenderly Ink Tests

concurrency:
  group: tenderly-ink-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**/*InkWhitelabel*/**"
      - "src/**/*InkWhitelabel*.sol"
      - "foundry.toml"
      - "remappings.txt"
      - ".github/workflows/tenderly-ink.yml"

permissions:
  contents: read

jobs:
  tenderly-ink:
    name: Ink proposal tests on Tenderly VNet
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Foundry setup
        uses: bgd-labs/github-workflows/.github/actions/foundry-setup@main

      - name: Create Tenderly Ink VNet
        uses: Tenderly/vnet-github-action@v1.0.17
        with:
          mode: CI
          access_key: ${{ secrets.TENDERLY_ACCESS_KEY }}
          project_name: project
          account_name: ink-foundation
          testnet_name: tydro-ink-${{ github.run_id }}
          network_id: |
            57073
          chain_id_prefix: ""
          block_number: "0x2e6a76e"
          state_sync: false
          public_explorer: false
          verification_visibility: bytecode
          push_on_complete: false

      - name: Run Ink proposal tests
        run: |
          set -euo pipefail
          export RPC_INK="${TENDERLY_PUBLIC_RPC_URL_57073:?Tenderly Ink RPC URL is missing}"

          test_list="${RUNNER_TEMP}/ink-whitelabel-tests"
          find src -type f -name '*.t.sol' -path '*InkWhitelabel*' -print0 | LC_ALL=C sort -z > "$test_list"
          mapfile -d '' -t tests < "$test_list"

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No Ink Whitelabel tests found."
            exit 1
          fi

          status=0
          for test_file in "${tests[@]}"; do
            echo "Running ${test_file}"
            if ! FOUNDRY_PROFILE="test" forge test --match-path "${test_file}" -vvv; then
              echo "::error file=${test_file}::Ink Whitelabel test failed."
              status=1
            fi
          done
          exit "$status"
